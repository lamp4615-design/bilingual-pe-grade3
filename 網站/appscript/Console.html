<!doctype html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教師後台</title>
<style>
:root { --brand:#0f766e; --brand-soft:#d9f0ec; --ink:#1c2b2a; --muted:#5f6f6d; --line:#d6dedc; --bg:#f5f8f7; --surface:#fff; --warn:#fff3d6; --bad:#b42318; --radius:12px; }
@media (prefers-color-scheme: dark) { :root { --brand:#3cc3b4; --brand-soft:#16413c; --ink:#e8f1ef; --muted:#9bb0ad; --line:#2d4442; --bg:#101918; --surface:#182524; --warn:#4a3b12; --bad:#ff8a80; } }
* { box-sizing:border-box; }
body { margin:0; font:16px/1.55 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--ink); }
header { background:var(--brand); color:#fff; padding:10px 16px; display:flex; align-items:baseline; gap:10px; }
header b { font-size:1.15rem; } header span { opacity:.85; font-size:.85rem; }
@media (prefers-color-scheme: dark) { header { color:#06201d; } }
nav { display:flex; gap:4px; padding:8px 12px 0; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; overflow-x:auto; }
nav button { flex:1; min-width:84px; padding:10px 8px; border:0; border-bottom:3px solid transparent; background:none; font:inherit; font-weight:700; color:var(--muted); cursor:pointer; }
@media print { header, nav, .noprint { display:none !important; } body { background:#fff; color:#000; } .card { break-inside:avoid; } }
nav button.on { color:var(--brand); border-color:var(--brand); }
main { max-width:980px; margin:0 auto; padding:14px 14px 80px; }
h2 { font-size:1.1rem; margin:20px 0 8px; } h3 { font-size:1rem; margin:0 0 6px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin:0 0 12px; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
.muted { color:var(--muted); } .small { font-size:.88rem; }
label { font-size:.88rem; color:var(--muted); display:block; margin:0 0 2px; }
.f { display:flex; flex-direction:column; }
input, select, textarea { font:inherit; font-size:16px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); max-width:100%; }
textarea { width:100%; }
.btn { padding:9px 18px; border-radius:10px; border:1px solid var(--brand); background:var(--brand); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
@media (prefers-color-scheme: dark) { .btn { color:#06201d; } }
.btn.ghost { background:transparent; color:var(--brand); } .btn.sm { padding:4px 12px; font-size:.88rem; } .btn.danger { border-color:var(--bad); color:var(--bad); background:transparent; }
.btn:disabled { opacity:.5; }
table { border-collapse:collapse; width:100%; font-size:.95rem; }
th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
th { color:var(--muted); font-weight:600; font-size:.85rem; }
.scroll { overflow-x:auto; }
.stat { font-size:1.5rem; font-weight:800; margin:2px 0; }
.chip { display:inline-block; padding:1px 10px; border-radius:99px; background:var(--brand-soft); color:var(--brand); font-size:.8rem; font-weight:700; }
.up { color:var(--brand); font-weight:700; } .down { color:var(--bad); }
.notice { background:var(--warn); border-radius:10px; padding:8px 12px; margin:8px 0; }
.sec { width:7.5em; }
.bar { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--line); margin-top:4px; }
.bar i { display:block; } .g3 { background:#2e9e6b; } .g2 { background:#e0b100; } .g1 { background:#d9534f; }
.gh { display:flex; justify-content:space-between; align-items:baseline; background:var(--brand-soft); margin:-14px -16px 8px; padding:8px 16px; border-radius:var(--radius) var(--radius) 0 0; }
.mem { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line); }
.mem .no { flex:1; } .mem select { font-size:.85rem; padding:3px 6px; }
.baton { width:1.7em; height:1.7em; border-radius:50%; background:var(--brand); color:#fff; font-size:.8rem; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
@media (prefers-color-scheme: dark) { .baton { color:#06201d; } }
#toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:99px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; max-width:90vw; }
#toast.on { opacity:1; }
details summary { cursor:pointer; color:var(--brand); font-weight:700; }
.abs { display:inline-flex; align-items:center; gap:4px; margin:3px 10px 3px 0; font-size:.9rem; color:var(--ink); }
</style>
</head>
<body>
<header><b>教師後台</b><span>雙語體育共學站 · 三年級甲班／乙班</span></header>
<nav id="tabs">
  <button data-t="rec">登記成績</button><button data-t="view">成績總覽</button><button data-t="sel">選手</button><button data-t="grp">分組</button><button data-t="ros">名單</button>
</nav>
<main id="main"><p class="muted">載入中…</p></main>
<div id="toast"></div>
<script>
/* ===== 基本設定 ===== */
const ITEMS = [
  { name: '100公尺跑', unit: '秒', better: 'low', min: 8, max: 60 }
];
const METHODS = {
  balanced: { label: '能力均衡（蛇行）', hint: '每組都有快有慢、整體實力相當。適合接力比賽，比賽才公平。', needsValue: true },
  leveled: { label: '同質分層（快慢分開）', hint: '速度相近的人同一組，快的跟快的、慢的跟慢的。適合分層練習。', needsValue: true },
  pairs: { label: '師徒配對（最快帶最慢）', hint: '固定兩人一組：最快配最慢、次快配次慢……適合互相教學。', needsValue: true },
  random: { label: '完全隨機', hint: '不看成績，純抽籤。' },
  team: { label: '沿用原本的隊', hint: '照名單裡的隊別分組（兩班合併時，相同隊號併成一組）。' }
};
// 第一單元的選手遴選規則：男／女各取幾名、另外不分性別再取幾名（人數可在「選手」分頁直接改）
const SEL_EVENTS = [
  { name: '100公尺競賽', boys: 2, girls: 2, any: 0 },
  { name: '400公尺接力賽', boys: 4, girls: 4, any: 0 },
  { name: '大隊接力賽', boys: 0, girls: 0, any: 16 }
];
const S = { roster: [], classes: [], scores: {}, groupings: null, tab: 'rec',
  rec: { cls: '', item: ITEMS[0].name, date: '', trial: 1 },
  view: { cls: '全部', item: ITEMS[0].name, date: '' },
  grp: { scope: '', item: ITEMS[0].name, basis: 'latest', method: 'balanced', byMode: 'k', k: 4, size: 5, order: 'slow_first', unmeasured: 'spread', absent: new Set(), cur: null },
  ros: { cls: '' },
  sel: { scope: '每班各自', item: ITEMS[0].name, basis: 'latest', noDup: false, events: SEL_EVENTS.map((e) => Object.assign({}, e)), absent: new Set(), res: null } };

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const run = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler((e) => no(new Error((e && e.message) || String(e)))) [fn](...a));
let tt; const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); };
const pad = (n) => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const itemOf = (n) => ITEMS.find((i) => i.name === n) || ITEMS[0];
const fmt = (v, it) => (v == null ? '—' : (it && it.unit === '公分' ? String(Math.round(v * 10) / 10) : Number(v).toFixed(2)));
const clsRoster = (c) => S.roster.filter((r) => r['班級'] === c).sort((a, b) => a['座號'] - b['座號']);
const optList = (arr, cur) => arr.map((x) => '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
const better = (it, a, b) => (it.better === 'low' ? Math.min(a, b) : Math.max(a, b));       // 兩個成績取較好的
const strength = (it, v) => (it.better === 'low' ? -v : v);                                   // 越大越強
const gain = (it, prev, cur) => (it.better === 'low' ? prev - cur : cur - prev);              // 正數＝進步
const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

async function scoresOf(item, force) {
  if (force || !S.scores[item]) S.scores[item] = await run('tc_getScores', item);
  return S.scores[item];
}
// best[日期][班級][座號] ＝ 當天最好的一次
function bestMap(rows, it) {
  const m = {};
  rows.forEach((r) => { const v = Number(r['成績']); const d = (m[r['日期']] = m[r['日期']] || {}); const c = (d[r['班級']] = d[r['班級']] || {}); c[r['座號']] = c[r['座號']] == null ? v : better(it, c[r['座號']], v); });
  return m;
}

/* ===== 分頁切換 ===== */
function go(t) {
  S.tab = t;
  $$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  ({ rec: viewRec, view: viewScores, sel: viewSelect, grp: viewGroups, ros: viewRoster })[t]().catch((e) => { $('#main').innerHTML = '<div class="notice">讀取失敗：' + esc(e.message) + '</div>'; });
}
$('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.t); };

/* ===== 1. 登記成績 ===== */
async function viewRec() {
  const R = S.rec; R.cls = R.cls || S.classes[0]; R.date = R.date || today();
  await scoresOf(R.item);
  $('#main').innerHTML = '<div class="card"><div class="row">' +
    '<div class="f"><label>班級</label><select id="c">' + optList(S.classes, R.cls) + '</select></div>' +
    '<div class="f"><label>項目</label><select id="i">' + optList(ITEMS.map((i) => i.name), R.item) + '</select></div>' +
    '<div class="f"><label>日期</label><input type="date" id="d" value="' + R.date + '"></div>' +
    '<div class="f"><label>第幾次</label><select id="t">' + [1, 2, 3].map((n) => '<option value="' + n + '"' + (R.trial === n ? ' selected' : '') + '>第 ' + n + ' 次</option>').join('') + '</select></div></div>' +
    '<p class="small muted" id="hint"></p><div class="scroll" id="tbl"></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="save">儲存</button><span class="small muted" id="cnt"></span></div>' +
    '<p class="small muted">空白＝沒測（缺席），不會寫入。要更正就直接改數字再儲存，同一天、同一次會覆蓋原本那筆。按 Enter 跳到下一位。</p></div>';
  const draw = () => {
    const it = itemOf(R.item);
    const cur = {}; S.scores[R.item].filter((r) => r['班級'] === R.cls && r['日期'] === R.date && Number(r['次別']) === R.trial).forEach((r) => { cur[r['座號']] = r['成績']; });
    $('#hint').textContent = '單位：' + it.unit + '（' + (it.better === 'low' ? '數字越小越好' : '數字越大越好') + '，合理範圍 ' + it.min + '–' + it.max + '）';
    $('#tbl').innerHTML = '<table><thead><tr><th>座號</th><th>隊</th><th>' + it.unit + '</th></tr></thead><tbody>' + clsRoster(R.cls).map((r) =>
      '<tr><td>' + r['座號'] + '</td><td>' + r['隊'] + '</td><td><input class="sec" data-no="' + r['座號'] + '" inputmode="decimal" value="' + (cur[r['座號']] != null ? esc(cur[r['座號']]) : '') + '"></td></tr>').join('') + '</tbody></table>';
    count();
  };
  const count = () => { const all = $$('.sec'); $('#cnt').textContent = '已輸入 ' + all.filter((x) => x.value.trim()).length + ' / ' + all.length + ' 人'; };
  $('#c').onchange = (e) => { R.cls = e.target.value; draw(); };
  $('#i').onchange = async (e) => { R.item = e.target.value; await scoresOf(R.item); draw(); };
  $('#d').onchange = (e) => { R.date = e.target.value; draw(); };
  $('#t').onchange = (e) => { R.trial = Number(e.target.value); draw(); };
  $('#tbl').oninput = count;
  $('#tbl').onkeydown = (e) => { if (e.key === 'Enter' && e.target.classList.contains('sec')) { e.preventDefault(); const all = $$('.sec'); const n = all[all.indexOf(e.target) + 1]; if (n) n.focus(); else e.target.blur(); } };
  $('#save').onclick = async () => {
    const it = itemOf(R.item), items = []; let bad = '';
    $$('.sec').forEach((inp) => {
      const raw = inp.value.trim(); if (!raw) return; const v = Number(raw);
      if (!(v >= it.min && v <= it.max)) bad = bad || '座號 ' + inp.dataset.no + ' 的「' + raw + '」不在合理範圍（' + it.min + '–' + it.max + '）';
      items.push({ '日期': R.date, '班級': R.cls, '項目': R.item, '座號': inp.dataset.no, '次別': R.trial, '成績': v, '單位': it.unit });
    });
    if (!R.date) return toast('請選日期'); if (bad) return toast(bad); if (!items.length) return toast('還沒有輸入任何成績');
    $('#save').disabled = true;
    try { S.scores[R.item] = await run('tc_saveScores', items); toast('已儲存 ' + items.length + ' 筆'); draw(); } catch (e) { toast('失敗：' + e.message); }
    $('#save').disabled = false;
  };
  draw();
}

/* ===== 2. 成績總覽 ===== */
function lineChart(series, dates, it) {
  const W = 320, H = 150, L = 36, B = 22, T = 10, R = 10; const vals = series.flatMap((s) => s.pts.filter((p) => p != null)); if (!vals.length || dates.length < 2) return '';
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { hi += 1; lo -= 1; }
  const x = (i) => L + (W - L - R) * (i / (dates.length - 1)), y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo)); const col = ['#0f766e', '#d9822b', '#5b6ee1'];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="各班平均趨勢"><line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" stroke="currentColor" opacity=".25"/>' +
    '<text x="2" y="' + (T + 8) + '" font-size="10" fill="currentColor">' + fmt(hi, it) + '</text><text x="2" y="' + (H - B) + '" font-size="10" fill="currentColor">' + fmt(lo, it) + '</text>' +
    dates.map((d, i) => '<text x="' + x(i) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="currentColor">' + esc(d.slice(5)) + '</text>').join('') +
    series.map((s, k) => '<polyline fill="none" stroke="' + col[k % 3] + '" stroke-width="2.5" points="' + s.pts.map((v, i) => (v == null ? '' : x(i) + ',' + y(v))).filter(Boolean).join(' ') + '"/>' +
      s.pts.map((v, i) => (v == null ? '' : '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="3.5" fill="' + col[k % 3] + '"/>')).join('')).join('') + '</svg>' +
    '<div class="small">' + series.map((s, k) => '<span style="color:' + col[k % 3] + '">● ' + esc(s.name) + '</span>').join('　') + '</div>';
}
async function viewScores() {
  const V = S.view; const it = itemOf(V.item); const rows = await scoresOf(V.item);
  const best = bestMap(rows, it); const dates = Object.keys(best).sort(); V.date = dates.includes(V.date) ? V.date : (dates[dates.length - 1] || '');
  const shown = V.cls === '全部' ? S.classes : [V.cls];
  const head = '<div class="card"><div class="row"><div class="f"><label>項目</label><select id="i">' + optList(ITEMS.map((i) => i.name), V.item) + '</select></div>' +
    '<div class="f"><label>班級</label><select id="c">' + optList(['全部'].concat(S.classes), V.cls) + '</select></div>' +
    '<div class="f"><label>測驗日期</label><select id="d">' + (dates.length ? optList(dates.slice().reverse(), V.date) : '<option>（尚無資料）</option>') + '</select></div></div></div>';
  let body = '';
  if (!dates.length) body = '<div class="card muted">這個項目還沒有任何成績。請先到「登記成績」輸入。</div>';
  else {
    const prevDates = dates.filter((d) => d < V.date);
    const people = [];
    shown.forEach((c) => clsRoster(c).forEach((r) => {
      const v = best[V.date] && best[V.date][c] ? best[V.date][c][r['座號']] : null; if (v == null) return;
      const prevs = prevDates.map((d) => best[d] && best[d][c] ? best[d][c][r['座號']] : null).filter((x) => x != null);
      const prev = prevs.length ? prevs.reduce((a, b) => better(it, a, b)) : null;
      people.push({ cls: c, no: r['座號'], team: r['隊'], v, prev, hist: dates.map((d) => (best[d] && best[d][c] ? best[d][c][r['座號']] : null)) });
    }));
    people.sort((a, b) => strength(it, b.v) - strength(it, a.v));
    const cards = shown.map((c) => { const vs = people.filter((p) => p.cls === c).map((p) => p.v); const total = clsRoster(c).length;
      return '<div class="card"><div class="small muted">' + esc(c) + '（測了 ' + vs.length + ' / ' + total + ' 人）</div>' + (vs.length ?
        '<div class="stat">平均 ' + fmt(mean(vs), it) + ' ' + it.unit + '</div><div class="small">最好 ' + fmt(vs.reduce((a, b) => better(it, a, b)), it) + '　最後 ' + fmt(vs.reduce((a, b) => (better(it, a, b) === a ? b : a)), it) + '</div>' : '<div class="muted">這天沒有資料</div>') + '</div>'; }).join('');
    const series = shown.map((c) => ({ name: c, pts: dates.map((d) => { const o = best[d] && best[d][c]; const v = o ? Object.values(o) : []; return v.length ? mean(v) : null; }) }));
    body = '<div class="grid">' + cards + '</div>' +
      (dates.length > 1 ? '<div class="card"><h3>各班平均的變化</h3>' + lineChart(series, dates, it) + '</div>' : '') +
      '<h2>' + esc(V.date) + ' 個人成績</h2><div class="card scroll"><table><thead><tr><th>名次</th><th>班級</th><th>座號</th><th>隊</th><th>' + it.unit + '</th><th>比之前最佳</th><th>歷次</th></tr></thead><tbody>' +
      people.map((p, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(p.cls) + '</td><td>' + p.no + '</td><td>' + p.team + '</td><td><b>' + fmt(p.v, it) + '</b></td><td>' +
        (p.prev == null ? '<span class="muted">首次</span>' : (gain(it, p.prev, p.v) > 0 ? '<span class="up">▲ ' + fmt(gain(it, p.prev, p.v), it) + '</span>' : gain(it, p.prev, p.v) < 0 ? '<span class="down">▼ ' + fmt(-gain(it, p.prev, p.v), it) + '</span>' : '＝')) +
        '</td><td class="small muted">' + p.hist.map((x) => fmt(x, it)).join(' → ') + '</td></tr>').join('') + '</tbody></table>' +
      '<p class="small muted">▲＝比之前最佳進步。三年級重點是看自己有沒有進步；名次僅供老師參考，不建議公開排名。歷次依日期由早到晚（' + dates.map((d) => d.slice(5)).join('、') + '）。</p>' +
      '<button class="btn sm ghost" id="csv">下載這個項目的全部成績 CSV</button></div>';
  }
  $('#main').innerHTML = head + body + '<h2>學生自評／同儕互評（課堂 iPad 收到的）</h2><div class="card"><button class="btn sm" id="ev">載入</button><div id="evo"></div></div>';
  $('#i').onchange = (e) => { V.item = e.target.value; viewScores(); };
  $('#c').onchange = (e) => { V.cls = e.target.value; viewScores(); };
  $('#d').onchange = (e) => { V.date = e.target.value; viewScores(); };
  const csv = $('#csv'); if (csv) csv.onclick = () => { const h = ['日期', '班級', '項目', '座號', '次別', '成績', '單位', '備註']; const t = '﻿' + [h].concat(rows.map((r) => h.map((k) => r[k]))).map((a) => a.map((c) => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\r\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' })); a.download = V.item + '成績.csv'; a.click(); };
  $('#ev').onclick = async () => {
    $('#evo').textContent = '載入中…'; let out = '';
    try {
      for (const c of shown) {
        const r = await run('tc_assessSummary', c);

// 每個人：{cls, no, team, v}；v 為依「取值方式」算出的成績（沒測過是 null）
async function peopleFor(G, scopeClasses) {
  const it = itemOf(G.item); const rows = await scoresOf(G.item); const scope = scopeClasses || (G.scope === '兩班合併' ? S.classes : [G.scope]);
  const per = {}; rows.forEach((r) => { const k = r['班級'] + '-' + r['座號']; const v = Number(r['成績']); const o = (per[k] = per[k] || { byDate: {} }); o.byDate[r['日期']] = o.byDate[r['日期']] == null ? v : better(it, o.byDate[r['日期']], v); });
  const people = [];
  scope.forEach((c) => clsRoster(c).forEach((r) => {
    const k = c + '-' + r['座號']; if (G.absent.has(k)) return; const o = per[k]; let v = null;
    if (o) { const ds = Object.keys(o.byDate).sort(); v = G.basis === 'latest' ? o.byDate[ds[ds.length - 1]] : ds.map((d) => o.byDate[d]).reduce((a, b) => better(it, a, b)); }
    people.push({ cls: c, no: r['座號'], team: r['隊'], sex: r['性別'] || '', v });
  }));

}
function makeGroups(people, G) {

  const unm = shuffle(people.filter((p) => p.v == null));
  const usable = M.needsValue && G.unmeasured === 'skip' ? measured : measured.concat(unm);
  const n = usable.length; if (!n) throw new Error('沒有可以分組的學生（可能全部缺席，或這個項目還沒有成績）');
  let groups;
  const smallest = () => groups.reduce((a, g) => (g.length < a.length ? g : a), groups[0]);
  if (G.method === 'team') {
    const by = {}; people.forEach((p) => { (by[p.team] = by[p.team] || []).push(p); }); groups = Object.keys(by).sort((a, b) => a - b).map((k) => by[k]);
  } else if (G.method === 'pairs') {
    groups = []; let i = 0, j = measured.length - 1;
    while (i < j) { groups.push([measured[i++], measured[j--]]); } if (i === j) { if (groups.length) groups[groups.length - 1].push(measured[i]); else groups.push([measured[i]]); }
    if (G.unmeasured !== 'skip') { for (let u = 0; u < unm.length; u += 2) groups.push(unm.slice(u, u + 2)); }
  } else {
    const k = Math.max(1, Math.min(n, G.byMode === 'size' ? Math.ceil(n / Math.max(1, G.size)) : G.k)); groups = Array.from({ length: k }, () => []);
    if (G.method === 'balanced') { measured.forEach((p, i) => { const r = Math.floor(i / k), pos = i % k; groups[r % 2 === 0 ? pos : k - 1 - pos].push(p); }); if (G.unmeasured !== 'skip') unm.forEach((p) => smallest().push(p)); }

    else { shuffle(people).forEach((p, i) => groups[i % k].push(p)); }

  return groups.filter((g) => g.length);
}

}

/* ===== 5. 選手遴選：依 100 公尺成績挑人 ===== */
function pickEvent(pool, ev, taken, noDup) {
  const key = (p) => p.cls + '-' + p.no, it = itemOf(S.sel.item);
  const avail = pool.filter((p) => !(noDup && taken.has(key(p))));              // pool 已依成績由好到壞排好
  const boys = avail.filter((p) => p.sex === '男'), girls = avail.filter((p) => p.sex === '女');
  const picked = [], alts = [], notes = [];
  const take = (list, n, tag) => { list.slice(0, n).forEach((p) => picked.push({ p, tag })); list.slice(n, n + 2).forEach((p) => alts.push({ p, tag })); if (list.length < n) notes.push(tag + '只有 ' + list.length + ' 人有成績，缺 ' + (n - list.length) + ' 位');
    if (n > 0 && list[n - 1] && list[n] && list[n - 1].v === list[n].v) notes.push(tag + '第 ' + n + ' 名與候補同成績（' + fmt(list[n].v, it) + '），請老師決定'); };
  if (ev.boys > 0) take(boys, ev.boys, '男');
  if (ev.girls > 0) take(girls, ev.girls, '女');
  if (ev.any > 0) { const chosen = new Set(picked.map((x) => key(x.p))); take(avail.filter((p) => !chosen.has(key(p))), ev.any, '不分'); }
  const ord = (a, b) => strength(it, b.p.v) - strength(it, a.p.v); picked.sort(ord); alts.sort(ord);
  picked.forEach((x) => taken.add(key(x.p)));
  return { ev, picked, alts, notes };
}

}

function selHtml(res) {
  const it = itemOf(S.sel.item);
  return res.map((r) => '<h2>' + esc(r.label) + '</h2>' + (r.noSex || r.noTime ? '<div class="notice small">' + (r.noSex ? r.noSex + ' 人沒填性別（請到「名單」補）。' : '') + (r.noTime ? r.noTime + ' 人還沒有' + esc(it.name) + '成績。' : '') + '以上的人不會被選入。</div>' : '') +
    '<div class="grid">' + r.events.map((e) => '<div class="card"><div class="gh"><b>' + esc(e.ev.name) + '</b><span class="small">' + [e.ev.boys ? '男 ' + e.ev.boys : '', e.ev.girls ? '女 ' + e.ev.girls : '', e.ev.any ? '不分性別 ' + e.ev.any : ''].filter(Boolean).join('、') + '</span></div>' +
      e.notes.map((n) => '<div class="notice small">⚠ ' + esc(n) + '</div>').join('') +
      '<table><tbody>' + e.picked.map((x, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(x.p.cls) + ' ' + x.p.no + ' 號</td><td>' + esc(x.p.sex) + '</td><td><b>' + fmt(x.p.v, it) + '</b></td></tr>').join('') + '</tbody></table>' +
      (e.alts.length ? '<div class="small muted" style="margin-top:6px">候補：' + e.alts.map((x) => esc(x.p.cls) + ' ' + x.p.no + ' 號(' + esc(x.p.sex) + ' ' + fmt(x.p.v, it) + ')').join('、') + '</div>' : '') + '</div>').join('') + '</div>').join('');
}
function showSelect() {
  const G = S.sel; if (!G.res) { $('#sres').innerHTML = ''; return; }
  $('#sres').innerHTML = selHtml(G.res) + '<div class="card noprint"><div class="row"><div class="f"><label>名單名稱</label><input id="sn" size="24" value="運動會選手 ' + today().slice(5) + '"></div></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="ssv">儲存這份選手名單</button><button class="btn ghost" id="spr">列印</button></div></div>';
  $('#spr').onclick = () => window.print();
  $('#ssv').onclick = async () => {
    const members = [], labels = []; G.res.forEach((r) => r.events.forEach((e) => { labels.push(r.label + ' ' + e.ev.name); const gi = labels.length; e.picked.forEach((x) => members.push({ 組別: gi, 班級: x.p.cls, 座號: x.p.no, 棒次: '', 成績: x.p.v })); }));
    if (!members.length) return toast('目前沒有任何入選的人');
    $('#ssv').disabled = true;
    try { S.groupings = await run('tc_saveGrouping', { 名稱: $('#sn').value.trim() || '運動會選手', 日期: today(), 策略: '選手遴選', 備註: G.scope + '；' + (G.basis === 'latest' ? '最近一次' : '歷史最好'),
      參數: JSON.stringify({ labels, item: G.item, scope: G.scope, basis: G.basis, noDup: G.noDup, events: G.events }), members }); toast('已儲存'); drawSelSaved(); } catch (e) { toast('失敗：' + e.message); }
    $('#ssv').disabled = false;
  };
}
function drawSelSaved() {
  const box = $('#ssaved'); if (!box) return; const L = (S.groupings || []).filter((g) => g.策略 === '選手遴選'); const it = itemOf(S.sel.item);
  box.innerHTML = L.length ? L.map((g) => { let P = {}; try { P = JSON.parse(g.參數 || '{}'); } catch (e) { /* 舊資料 */ } const by = {}; g.members.forEach((m) => { (by[m.組別] = by[m.組別] || []).push(m); });
    return '<div class="card"><div class="row" style="justify-content:space-between"><div><b>' + esc(g.名稱) + '</b> <span class="small muted">' + esc(g.日期) + ' · ' + esc(g.備註 || '') + '</span></div><button class="btn sm danger noprint" data-sdel="' + esc(g.id) + '">刪除</button></div>' +
      Object.keys(by).sort((a, b) => a - b).map((k) => '<div class="small" style="margin-top:6px"><b>' + esc((P.labels || [])[k - 1] || '第 ' + k + ' 組') + '</b>：' + by[k].map((m) => m.座號 + '號(' + esc(sexOf(m.班級, m.座號)) + ')' + (m.成績 === '' ? '' : ' ' + fmt(m.成績, it))).join('、') + '</div>').join('') + '</div>'; }).join('') : '<p class="muted">還沒有存過。</p>';
  $$('[data-sdel]', box).forEach((b) => { b.onclick = async () => { if (!confirm('確定刪除這份選手名單？')) return; try { S.groupings = await run('tc_deleteGrouping', b.dataset.sdel); drawSelSaved(); } catch (e) { toast(e.message); } }; });
}
async function viewSelect() {
  const G = S.sel; if (!S.groupings) S.groupings = await run('tc_getGroupings'); await scoresOf(G.item);
  const cs = S.classes; const noSexAll = S.roster.filter((r) => !r['性別']).length;
  const absentBox = cs.map((c) => '<div class="small"><b>' + esc(c) + '</b>：' + clsRoster(c).map((r) => { const k = c + '-' + r['座號']; return '<label class="abs"><input type="checkbox" data-abs="' + k + '"' + (G.absent.has(k) ? ' checked' : '') + '>' + r['座號'] + '</label>'; }).join('') + '</div>').join('');
  $('#main').innerHTML = (noSexAll ? '<div class="notice">名單裡有 ' + noSexAll + ' 人還沒填性別，選手遴選會略過他們。請到「名單」分頁補上（格式：座號,性別）。</div>' : '') +
    '<div class="card noprint"><h3>遴選規則</h3><div class="row"><div class="f"><label>範圍</label><select id="ss"><option' + (G.scope === '每班各自' ? ' selected' : '') + '>每班各自</option><option' + (G.scope === '兩班合併' ? ' selected' : '') + '>兩班合併</option></select></div>' +
    '<div class="f"><label>依據成績</label><select id="sb"><option value="latest"' + (G.basis === 'latest' ? ' selected' : '') + '>每人最近一次 ' + esc(G.item) + '</option><option value="best"' + (G.basis === 'best' ? ' selected' : '') + '>每人歷史最好</option></select></div></div>' +
    '<div class="scroll" style="margin-top:8px"><table><thead><tr><th>項目</th><th>男生取</th><th>女生取</th><th>不分性別另取</th></tr></thead><tbody>' + G.events.map((e, i) => '<tr><td>' + esc(e.name) + '</td>' +
      ['boys', 'girls', 'any'].map((k) => '<td><input type="number" min="0" max="40" data-ev="' + i + '" data-k="' + k + '" value="' + e[k] + '" style="width:5em"></td>').join('') + '</tr>').join('') + '</tbody></table></div>' +
    '<label class="abs" style="margin-top:8px"><input type="checkbox" id="nd"' + (G.noDup ? ' checked' : '') + '>同一個人不重複入選（由上到下依序挑：先 100 公尺競賽、再 400 公尺接力、最後大隊接力）</label>' +
    '<details style="margin-top:6px"><summary>受傷／請假、不參加的人（勾選的不會被挑）</summary><div>' + absentBox + '</div></details>' +
    '<div style="margin-top:12px"><button class="btn" id="smk">挑選</button></div></div><div id="sres"></div><h2 class="noprint">已存的選手名單</h2><div id="ssaved" class="noprint"></div>';
  $('#ss').onchange = (e) => { G.scope = e.target.value; G.res = null; showSelect(); };
  $('#sb').onchange = (e) => { G.basis = e.target.value; };
  $('#nd').onchange = (e) => { G.noDup = e.target.checked; };
  $$('[data-ev]').forEach((i) => { i.onchange = () => { G.events[+i.dataset.ev][i.dataset.k] = Math.max(0, Math.round(Number(i.value) || 0)); }; });
  $('#main').onchange = (e) => { const k = e.target.dataset && e.target.dataset.abs; if (!k) return; if (e.target.checked) G.absent.add(k); else G.absent.delete(k); };
  $('#smk').onclick = () => doSelect().catch((e) => toast(e.message));
  showSelect(); drawSelSaved();
}

/* ===== 啟動 ===== */
run('tc_init').then((d) => { S.roster = d.roster; S.classes = d.classes; S.rec.cls = S.classes[0]; S.grp.scope = S.classes[0]; go('rec'); })
  .catch((e) => { $('#main').innerHTML = '<div class="notice">無法啟動：' + esc(e.message) + '<br>請確認是用「只有我自己」的部署網址開啟，並已登入擁有這份試算表的 Google 帳號。</div>'; });
</script>
</body>
</html>
