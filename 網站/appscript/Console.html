<!doctype html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教師後台</title>
<style>
:root { --brand:#0f766e; --brand-soft:#d9f0ec; --ink:#1c2b2a; --muted:#5f6f6d; --line:#d6dedc; --bg:#f5f8f7; --surface:#fff; --warn:#fff3d6; --bad:#b42318; --radius:12px; }
@media (prefers-color-scheme: dark) { :root { --brand:#3cc3b4; --brand-soft:#16413c; --ink:#e8f1ef; --muted:#9bb0ad; --line:#2d4442; --bg:#101918; --surface:#182524; --warn:#4a3b12; --bad:#ff8a80; } }
* { box-sizing:border-box; }
body { margin:0; font:16px/1.55 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--ink); }
header { background:var(--brand); color:#fff; padding:10px 16px; display:flex; align-items:baseline; gap:10px; }
header b { font-size:1.15rem; } header span { opacity:.85; font-size:.85rem; }
@media (prefers-color-scheme: dark) { header { color:#06201d; } }
nav { display:flex; gap:4px; padding:8px 12px 0; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; overflow-x:auto; }
nav button { flex:1; min-width:84px; padding:10px 8px; border:0; border-bottom:3px solid transparent; background:none; font:inherit; font-weight:700; color:var(--muted); cursor:pointer; }
nav button.on { color:var(--brand); border-color:var(--brand); }
main { max-width:1200px; margin:0 auto; padding:14px 14px 80px; }
h2 { font-size:1.1rem; margin:20px 0 8px; } h3 { font-size:1rem; margin:0 0 6px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin:0 0 12px; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
.muted { color:var(--muted); } .small { font-size:.88rem; }
label { font-size:.88rem; color:var(--muted); display:block; margin:0 0 2px; }
.f { display:flex; flex-direction:column; }
input, select, textarea { font:inherit; font-size:16px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); max-width:100%; }
textarea { width:100%; }
.btn { padding:9px 18px; border-radius:10px; border:1px solid var(--brand); background:var(--brand); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
@media (prefers-color-scheme: dark) { .btn { color:#06201d; } }
.btn.ghost { background:transparent; color:var(--brand); } .btn.sm { padding:4px 12px; font-size:.88rem; } .btn.danger { border-color:var(--bad); color:var(--bad); background:transparent; }
.btn:disabled { opacity:.5; }
table { border-collapse:collapse; width:100%; font-size:.95rem; }
th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
th { color:var(--muted); font-weight:600; font-size:.85rem; }
.scroll { overflow-x:auto; }
.stat { font-size:1.5rem; font-weight:800; margin:2px 0; }
.chip { display:inline-block; padding:1px 10px; border-radius:99px; background:var(--brand-soft); color:var(--brand); font-size:.8rem; font-weight:700; }
.up { color:var(--brand); font-weight:700; } .down { color:var(--bad); }
.notice { background:var(--warn); border-radius:10px; padding:8px 12px; margin:8px 0; }
.sec { width:7.5em; }
.bar { display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--line); margin-top:4px; }
.bar i { display:block; } .g3 { background:#2e9e6b; } .g2 { background:#e0b100; } .g1 { background:#d9534f; }
.gh { display:flex; justify-content:space-between; align-items:baseline; background:var(--brand-soft); margin:-14px -16px 8px; padding:8px 16px; border-radius:var(--radius) var(--radius) 0 0; }
.mem { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line); }
.mem .no { flex:1; } .mem select { font-size:.85rem; padding:3px 6px; }
.baton { width:1.7em; height:1.7em; border-radius:50%; background:var(--brand); color:#fff; font-size:.8rem; font-weight:800; display:inline-flex; align-items:center; justify-content:center; }
@media (prefers-color-scheme: dark) { .baton { color:#06201d; } }
#toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 18px; border-radius:99px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; max-width:90vw; }
#toast.on { opacity:1; }
details summary { cursor:pointer; color:var(--brand); font-weight:700; }
.q { white-space:nowrap; line-height:1.3; } .q b { font-size:1.1rem; } .q .s { font-size:.78rem; color:var(--muted); }
tr.pick { cursor:pointer; } tr.pick:hover td { background:var(--brand-soft); } tr.sel td { background:var(--brand-soft); }
th.sortable { cursor:pointer; user-select:none; } th.sortable:hover { color:var(--brand); }
.statrow td { background:var(--brand-soft); font-size:.88rem; }
.tag { display:inline-block; padding:0 8px; border-radius:99px; font-size:.78rem; font-weight:700; background:var(--line); color:var(--ink); }
.tag.good { background:#d4f0e2; color:#14683f; } .tag.warn { background:var(--warn); color:#7a5a00; }
@media (prefers-color-scheme: dark) { .tag.good { background:#17402d; color:#7fe0ae; } .tag.warn { color:#ffd877; } }
.sx { display:inline-block; min-width:1.5em; text-align:center; border-radius:6px; font-size:.78rem; font-weight:800; padding:0 5px; margin-right:4px; }
.sx.m { background:#dbeafe; color:#1d4ed8; } .sx.f { background:#fce7f3; color:#be185d; } .sx.n { background:var(--line); color:var(--muted); }
@media (prefers-color-scheme: dark) { .sx.m { background:#1e3a5f; color:#9cc4ff; } .sx.f { background:#5a1d3d; color:#ffb3d6; } }
.leg { display:inline-flex; width:2em; height:2em; border-radius:50%; align-items:center; justify-content:center; background:var(--brand); color:#fff; font-weight:800; }
@media (prefers-color-scheme: dark) { .leg { color:#06201d; } }
.evtbl th, .evtbl td { white-space:nowrap; } .evtbl select { max-width:11em; }
.sub { opacity:.75; } .iconbtn { padding:2px 9px; min-width:2em; }
@media print { header, nav, .noprint, #toast { display:none !important; } body { background:#fff; } main { max-width:none; padding:0; } .card { break-inside:avoid; } }
.abs { display:inline-flex; align-items:center; gap:4px; margin:3px 10px 3px 0; font-size:.9rem; color:var(--ink); }
</style>
</head>
<body>
<header><b>教師後台</b><span>雙語體育共學站 · 三年級甲班／乙班</span></header>
<nav id="tabs">
  <button data-t="rec">登記成績</button><button data-t="grade">課堂評分</button><button data-t="peer">同儕計分</button><button data-t="jrn">教學紀錄</button><button data-t="view">成績總覽</button><button data-t="stu">個人表現</button><button data-t="evt">運動會選手</button><button data-t="grp">分組</button><button data-t="ros">名單</button>
</nav>
<main id="main"><p class="muted">載入中…</p></main>
<div id="toast"></div>
<script>
/* ===== 基本設定 ===== */
const ITEMS = [
  { name: '80公尺跑', unit: '秒', better: 'low', min: 6, max: 50 },
  { name: '100公尺跑', unit: '秒', better: 'low', min: 8, max: 60 },
  { name: '800公尺跑', unit: '秒', better: 'low', min: 100, max: 900 },
  { name: '立定跳遠', unit: '公分', better: 'high', min: 30, max: 300 }
];
const METHODS = {
  balanced: { label: '能力均衡（蛇行）', hint: '每組都有快有慢、整體實力相當。適合接力比賽，比賽才公平。', needsValue: true },
  leveled: { label: '同質分層（快慢分開）', hint: '速度相近的人同一組，快的跟快的、慢的跟慢的。適合分層練習。', needsValue: true },
  pairs: { label: '師徒配對（最快帶最慢）', hint: '固定兩人一組：最快配最慢、次快配次慢……適合互相教學。', needsValue: true },
  random: { label: '完全隨機', hint: '不看成績，純抽籤。' },
  team: { label: '沿用原本的隊', hint: '照名單裡的隊別分組（兩班合併時，相同隊號併成一組）。' }
};
const SITE = 'https://lamp4615-design.github.io/bilingual-pe-grade3/';  // 教案資料（單元、節次、評量項目）從網站讀
const GRADE_LABEL = { 0: '—', 1: '努力中', 2: '達成', 3: '優異' };
const S = { roster: [], classes: [], scores: {}, groupings: null, tab: 'rec',
  rec: { cls: '', item: '100公尺跑', date: '', trial: 1 },
  view: { cls: '全部', item: '100公尺跑', date: '' },
  stu: { cls: '全部', basis: 'latest', scope: 'class', sex: '全部', sk: 'no', sd: 1, sel: null, unit: null },
  assess: {}, assessRaw: {},
  evt: { preset: 'sprint', nM: 2, nF: 2, rM: 2, rF: 2, nA: 16, rA: 2, item: '', basis: 'best', order: 'alt_f', anchor: 'slow_first', absent: new Set(), pin: new Set(), cur: null, saved: null },
  grp: { scope: '', item: '100公尺跑', basis: 'latest', method: 'balanced', byMode: 'k', k: 4, size: 5, order: 'slow_first', unmeasured: 'spread', absent: new Set(), cur: null },
  ros: { cls: '' }, grade: { cls: '', sec: 1, lesson: null, rows: [] },
  peer: { uid: '', sec: null, cls: '', grp: 'A', mode: 'item', memb: {}, rows: [] },
  jrn: { uid: '', sec: null, cls: '', date: null, mode: 'edit', cache: {} } };

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const run = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler((e) => no(new Error((e && e.message) || String(e)))) [fn](...a));
let tt; const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); };
const pad = (n) => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const itemOf = (n) => ITEMS.find((i) => i.name === n) || ITEMS[0];
const fmt = (v, it) => (v == null ? '—' : (it && it.unit === '公分' ? String(Math.round(v * 10) / 10) : Number(v).toFixed(2)));
const clsRoster = (c) => S.roster.filter((r) => r['班級'] === c).sort((a, b) => a['座號'] - b['座號']);
const optList = (arr, cur) => arr.map((x) => '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
const better = (it, a, b) => (it.better === 'low' ? Math.min(a, b) : Math.max(a, b));       // 兩個成績取較好的
const strength = (it, v) => (it.better === 'low' ? -v : v);                                   // 越大越強
const gain = (it, prev, cur) => (it.better === 'low' ? prev - cur : cur - prev);              // 正數＝進步
const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

async function scoresOf(item, force) {
  if (force || !S.scores[item]) S.scores[item] = await run('tc_getScores', item);
  return S.scores[item];
}
// best[日期][班級][座號] ＝ 當天最好的一次
function bestMap(rows, it) {
  const m = {};
  rows.forEach((r) => { const v = Number(r['成績']); const d = (m[r['日期']] = m[r['日期']] || {}); const c = (d[r['班級']] = d[r['班級']] || {}); c[r['座號']] = c[r['座號']] == null ? v : better(it, c[r['座號']], v); });
  return m;
}

/* ===== 分頁切換 ===== */
function go(t) {
  S.tab = t;
  $$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  ({ rec: viewRec, grade: viewGrade, peer: viewPeer, jrn: viewJournal, view: viewScores, stu: viewStudents, evt: viewEvents, grp: viewGroups, ros: viewRoster })[t]().catch((e) => { $('#main').innerHTML = '<div class="notice">讀取失敗：' + esc(e.message) + '</div>'; });
}
$('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) go(b.dataset.t); };

/* ===== 1. 登記成績 ===== */
async function viewRec() {
  const R = S.rec; R.cls = R.cls || S.classes[0]; R.date = R.date || today();
  await scoresOf(R.item);
  $('#main').innerHTML = '<div class="card"><div class="row">' +
    '<div class="f"><label>班級</label><select id="c">' + optList(S.classes, R.cls) + '</select></div>' +
    '<div class="f"><label>項目</label><select id="i">' + optList(ITEMS.map((i) => i.name), R.item) + '</select></div>' +
    '<div class="f"><label>日期</label><input type="date" id="d" value="' + R.date + '"></div>' +
    '<div class="f"><label>第幾次</label><select id="t">' + [1, 2, 3].map((n) => '<option value="' + n + '"' + (R.trial === n ? ' selected' : '') + '>第 ' + n + ' 次</option>').join('') + '</select></div></div>' +
    '<p class="small muted" id="hint"></p><div class="scroll" id="tbl"></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="save">儲存</button><span class="small muted" id="cnt"></span></div>' +
    '<p class="small muted">空白＝沒測（缺席），不會寫入。要更正就直接改數字再儲存，同一天、同一次會覆蓋原本那筆。按 Enter 跳到下一位。</p></div>';
  const draw = () => {
    const it = itemOf(R.item);
    const cur = {}; S.scores[R.item].filter((r) => r['班級'] === R.cls && r['日期'] === R.date && Number(r['次別']) === R.trial).forEach((r) => { cur[r['座號']] = r['成績']; });
    $('#hint').textContent = '單位：' + it.unit + '（' + (it.better === 'low' ? '數字越小越好' : '數字越大越好') + '，合理範圍 ' + it.min + '–' + it.max + '）';
    $('#tbl').innerHTML = '<table><thead><tr><th>座號</th><th>隊</th><th>' + it.unit + '</th></tr></thead><tbody>' + clsRoster(R.cls).map((r) =>
      '<tr><td>' + r['座號'] + '</td><td>' + r['隊'] + '</td><td><input class="sec" data-no="' + r['座號'] + '" inputmode="decimal" value="' + (cur[r['座號']] != null ? esc(cur[r['座號']]) : '') + '"></td></tr>').join('') + '</tbody></table>';
    count();
  };
  const count = () => { const all = $$('.sec'); $('#cnt').textContent = '已輸入 ' + all.filter((x) => x.value.trim()).length + ' / ' + all.length + ' 人'; };
  $('#c').onchange = (e) => { R.cls = e.target.value; draw(); };
  $('#i').onchange = async (e) => { R.item = e.target.value; await scoresOf(R.item); draw(); };
  $('#d').onchange = (e) => { R.date = e.target.value; draw(); };
  $('#t').onchange = (e) => { R.trial = Number(e.target.value); draw(); };
  $('#tbl').oninput = count;
  $('#tbl').onkeydown = (e) => { if (e.key === 'Enter' && e.target.classList.contains('sec')) { e.preventDefault(); const all = $$('.sec'); const n = all[all.indexOf(e.target) + 1]; if (n) n.focus(); else e.target.blur(); } };
  $('#save').onclick = async () => {
    const it = itemOf(R.item), items = []; let bad = '';
    $$('.sec').forEach((inp) => {
      const raw = inp.value.trim(); if (!raw) return; const v = Number(raw);
      if (!(v >= it.min && v <= it.max)) bad = bad || '座號 ' + inp.dataset.no + ' 的「' + raw + '」不在合理範圍（' + it.min + '–' + it.max + '）';
      items.push({ '日期': R.date, '班級': R.cls, '項目': R.item, '座號': inp.dataset.no, '次別': R.trial, '成績': v, '單位': it.unit });
    });
    if (!R.date) return toast('請選日期'); if (bad) return toast(bad); if (!items.length) return toast('還沒有輸入任何成績');
    $('#save').disabled = true;
    try { S.scores[R.item] = await run('tc_saveScores', items); toast('已儲存 ' + items.length + ' 筆'); draw(); } catch (e) { toast('失敗：' + e.message); }
    $('#save').disabled = false;
  };
  draw();
}

/* ===== 課堂評分：老師逐人登記三等第與備註 ===== */
async function unitList() {
  if (!S.grade.units) S.grade.units = await (await fetch(SITE + 'data/units.json', { cache: 'no-cache' })).json();
  return S.grade.units;
}
async function lessonData(uid) {
  S.grade.lessons = S.grade.lessons || {};
  if (S.grade.lessons[uid]) return S.grade.lessons[uid];
  const u = (await unitList()).find((x) => x.id === uid);
  S.grade.lessons[uid] = await (await fetch(SITE + u.lesson, { cache: 'no-cache' })).json(); return S.grade.lessons[uid];
}
async function viewGrade() {
  const Gd = S.grade; Gd.cls = Gd.cls || S.classes[0]; let L, us;
  try {
    us = await unitList(); if (!Gd.uid || !us.some((u) => u.id === Gd.uid)) { Gd.uid = us[0].id; Gd.sec = null; }
    L = await lessonData(Gd.uid);
  } catch (e) { $('#main').innerHTML = '<div class="notice">讀不到教案資料（' + esc(e.message) + '）。請確認網站可以開啟。</div>'; return; }
  const sess = L['節次'].find((x) => x['節'] === Gd.sec) || L['節次'][0]; Gd.sec = sess['節'];
  // 評量項目：優先用該節的「教師評量」，沒有就用學生自評＋同儕的項目，再沒有就用全部評量規準
  const ev = sess['學生評量'] || {}; const names = (sess['教師評量'] && sess['教師評量'].length) ? sess['教師評量'] : Array.from(new Set((ev['自評'] || []).concat(ev['同儕'] || []))); const items = names.length ? names : L['評量規準'].map((r) => r['項目']);
  const rub = {}; L['評量規準'].forEach((r) => { rub[r['項目']] = (r['各節等第'] && r['各節等第'][String(Gd.sec)]) || r['等第'] || {}; });
  const unit = L['課程名稱']; Gd.rows = await run('tc_getTeacherGrades', { '單元': unit, '節': Gd.sec, '班級': Gd.cls });
  const cur = {}, note = {}; Gd.rows.forEach((r) => { if (r['項目'] === '備註') note[r['座號']] = r['備註']; else cur[r['座號'] + '|' + r['項目']] = Number(r['等第']); });
  $('#main').innerHTML = '<div class="card"><div class="row"><div class="f"><label>單元</label><select id="gu">' + us.map((u) => '<option value="' + esc(u.id) + '"' + (u.id === Gd.uid ? ' selected' : '') + '>' + esc(u.title) + '</option>').join('') + '</select></div>' +
    '<div class="f"><label>班級</label><select id="gc">' + optList(S.classes, Gd.cls) + '</select></div>' +
    '<div class="f"><label>節次</label><select id="gs">' + L['節次'].map((x) => '<option value="' + x['節'] + '"' + (x['節'] === Gd.sec ? ' selected' : '') + '>第 ' + x['節'] + ' 節　' + esc(x['主題']) + '</option>').join('') + '</select></div></div>' +
    '<p class="small muted">單元：' + esc(L['單元名稱']) + '。逐人選三等第（努力中／達成／優異），選「—」就是清除。這是老師的形成性觀察，不是成績。</p>' +
    '<details class="small" style="margin:6px 0"><summary>本節評量規準（三等第說明）</summary>' + items.map((n) => { const g = rub[n] || {}; return '<p><b>' + esc(n) + '</b>　優異：' + esc(g['優異'] || '—') + '　／ 達成：' + esc(g['達成'] || '—') + '　／ 努力中：' + esc(g['努力中'] || '—') + '</p>'; }).join('') + '</details>' +
    '<div class="scroll"><table><thead><tr><th>座號</th>' + items.map((n) => '<th>' + esc(n) + '</th>').join('') + '<th>備註</th></tr></thead><tbody>' + clsRoster(Gd.cls).map((r) =>
      '<tr><td>' + r['座號'] + '</td>' + items.map((n) => '<td><select class="gg" data-no="' + r['座號'] + '" data-it="' + esc(n) + '">' + [0, 1, 2, 3].map((g) => '<option value="' + g + '"' + ((cur[r['座號'] + '|' + n] || 0) === g ? ' selected' : '') + '>' + GRADE_LABEL[g] + '</option>').join('') + '</select></td>').join('') +
      '<td><input class="gn" data-no="' + r['座號'] + '" value="' + esc(note[r['座號']] || '') + '" size="14" maxlength="200"></td></tr>').join('') + '</tbody></table></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="gsv">儲存</button><span class="small muted" id="gm"></span></div></div>';
  $('#gu').onchange = (e) => { Gd.uid = e.target.value; Gd.sec = null; viewGrade(); };

/* ===== 同儕計分：組員設定、紙本計分表課後輸入、平均／星級／等第／小組得分 =====
   規則全部讀教案各節的「同儕計分」：項目與分數、滿分、輪替（組內編號）、星級門檻與稱號、星級對應等第、查核差距；小組得分讀「小組得分」。 */
const GL = (i) => String.fromCharCode(65 + i);
const GRADE_NUM = { '優異': 3, '達成': 2, '努力中': 1 };
async function peerUnits() {
  const out = []; for (const u of await unitList()) { const L = await lessonData(u.id); if (L['節次'].some((s) => s['同儕計分'])) out.push({ u, L }); } return out;
}
// 由計分紀錄算出每位打者的結果、每組的小組得分與需要查核的紀錄
function peerResults(rows, pc, gr) {
  const by = {}, turns = {}, flags = [];
  rows.forEach((r) => { (by[r['打者座號']] = by[r['打者座號']] || { grp: r['組別'], v: [] }).v.push(r['得分']); const k = r['組別'] + '|' + r['輪'] + '|' + r['打者座號']; (turns[k] = turns[k] || []).push(r); });
  const stars = pc['星級'].slice().sort((a, b) => b['門檻'] - a['門檻']);
  const res = {};
  Object.keys(by).forEach((no) => { const v = by[no].v, avg = mean(v), st = stars.find((x) => avg >= x['門檻'] - 1e-9) || stars[stars.length - 1];
    res[no] = { grp: by[no].grp, n: v.length, avg, star: st['星'], title: st['稱號'], grade: pc['星級對應等第'][String(st['星'])] }; });
  const gap = pc['查核差距'] || 2, groups = {};
  Object.keys(turns).forEach((k) => { const list = turns[k], [g, rd, no] = k.split('|'), sc = mean(list.map((x) => x['得分']));
    const G = (groups[g] = groups[g] || { sum: 0, n: 0 }); G.sum += sc; G.n += 1;
    if (list.length > 1) { const vs = list.map((x) => x['得分']); if (Math.max(...vs) - Math.min(...vs) >= gap) flags.push(g + ' 組第 ' + rd + ' 輪：' + no + ' 號的兩位計分員分數差 ' + (Math.max(...vs) - Math.min(...vs)) + ' 分（' + list.map((x) => x['計分員座號'] + ' 號給 ' + x['得分']).join('、') + '）'); } });
  if (pc['計分員人數'] === 1) {           // 每次只有 1 位計分員：比較同一位打者的各計分員分數，與其他人平均差太多的列出
    rows.forEach((r) => { const others = rows.filter((x) => x['打者座號'] === r['打者座號'] && x !== r).map((x) => x['得分']); if (others.length >= 2 && Math.abs(r['得分'] - mean(others)) >= gap) flags.push(r['組別'] + ' 組第 ' + r['輪'] + ' 輪：' + r['計分員座號'] + ' 號給 ' + r['打者座號'] + ' 號 ' + r['得分'] + ' 分，其他計分員平均 ' + mean(others).toFixed(1) + ' 分'); });
  }
  const th = (gr && gr['等第門檻'] ? gr['等第門檻'] : []).slice().sort((a, b) => b['百分比'] - a['百分比']);
  Object.keys(groups).forEach((g) => { const G = groups[g]; G.max = G.n * pc['滿分']; G.pct = G.max ? G.sum / G.max * 100 : 0; const t = th.find((x) => G.pct >= x['百分比'] - 1e-9); G.grade = t ? t['等第'] : ''; });
  return { res, groups, flags };
}

/* ===== 2. 成績總覽 ===== */
function lineChart(series, dates, it) {
  const W = 320, H = 150, L = 36, B = 22, T = 10, R = 10; const vals = series.flatMap((s) => s.pts.filter((p) => p != null)); if (!vals.length || dates.length < 2) return '';
  let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) { hi += 1; lo -= 1; }
  const x = (i) => L + (W - L - R) * (i / (dates.length - 1)), y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo)); const col = ['#0f766e', '#d9822b', '#5b6ee1'];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="各班平均趨勢"><line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" stroke="currentColor" opacity=".25"/>' +
    '<text x="2" y="' + (T + 8) + '" font-size="10" fill="currentColor">' + fmt(hi, it) + '</text><text x="2" y="' + (H - B) + '" font-size="10" fill="currentColor">' + fmt(lo, it) + '</text>' +
    dates.map((d, i) => '<text x="' + x(i) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="currentColor">' + esc(d.slice(5)) + '</text>').join('') +
    series.map((s, k) => '<polyline fill="none" stroke="' + col[k % 3] + '" stroke-width="2.5" points="' + s.pts.map((v, i) => (v == null ? '' : x(i) + ',' + y(v))).filter(Boolean).join(' ') + '"/>' +
      s.pts.map((v, i) => (v == null ? '' : '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="3.5" fill="' + col[k % 3] + '"/>')).join('')).join('') + '</svg>' +
    '<div class="small">' + series.map((s, k) => '<span style="color:' + col[k % 3] + '">● ' + esc(s.name) + '</span>').join('　') + '</div>';

function showCur() {
  const cur = S.grp.cur; if (!cur) { $('#res').innerHTML = ''; return; }
  $('#res').innerHTML = groupHtml(cur) + '<div class="card"><div class="row"><div class="f"><label>這次分組的名稱</label><input id="nm" value="' + esc(cur.title) + '" size="26"></div><div class="f"><label>備註（選填）</label><input id="nt" size="26" placeholder="例如：接力賽第 1 次分組"></div></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="sv">儲存這次分組（下一堂課可沿用）</button><button class="btn ghost" id="again">重新分組</button></div></div>';
  $$('.mv').forEach((s) => { s.onchange = () => { if (s.value === '') return; const gi = +s.dataset.g, pi = +s.dataset.p, to = +s.value; const [p] = cur.groups[gi].splice(pi, 1); cur.groups[to].push(p); cur.groups = cur.groups.filter((g) => g.length); cur.groups = orderBaton(cur.groups, cur.G); showCur(); }; });
  $('#again').onclick = () => doGroup();
  $('#sv').onclick = async () => {
    const members = []; cur.groups.forEach((g, gi) => g.forEach((p) => members.push({ 組別: gi + 1, 班級: p.cls, 座號: p.no, 棒次: p.baton, 成績: p.v == null ? '' : p.v })));
    const G = cur.G; $('#sv').disabled = true;
    try {
      S.groupings = await run('tc_saveGrouping', { 名稱: $('#nm').value.trim() || cur.title, 日期: today(), 策略: METHODS[G.method].label, 備註: $('#nt').value.trim(), members,
        參數: JSON.stringify({ scope: G.scope, item: G.item, basis: G.basis, method: G.method, byMode: G.byMode, k: G.k, size: G.size, order: G.order, unmeasured: G.unmeasured }) });
      toast('已儲存，下一堂課可以在下方「已存的分組」叫出來'); drawSaved();
    } catch (e) { toast('失敗：' + e.message); }
    $('#sv').disabled = false;
  };
}
async function doGroup() {
  const G = S.grp; G.k = Math.max(1, Math.round(Number($('#k').value) || 1)); G.size = Math.max(1, Math.round(Number($('#sz').value) || 1));
  try {
    const people = await peopleFor(G); const gs = orderBaton(makeGroups(people, G), G);
    G.cur = { G: Object.assign({}, G, { absent: new Set(G.absent) }), groups: gs, title: G.scope + ' ' + METHODS[G.method].label + ' ' + today().slice(5) }; showCur();
  } catch (e) { toast(e.message); }
}
function drawSaved() {
  const box = $('#saved'); if (!box) return; const L = S.groupings || [];
  box.innerHTML = L.length ? L.map((g) => { const n = new Set(g.members.map((m) => m.組別)).size;
    return '<div class="card"><div class="row" style="justify-content:space-between"><div><b>' + esc(g.名稱) + '</b> <span class="chip">' + esc(g.策略) + '</span><div class="small muted">' + esc(g.日期) + ' · ' + n + ' 組 · ' + g.members.length + ' 人' + (g.備註 ? ' · ' + esc(g.備註) : '') + '</div></div>' +
      '<div class="row"><button class="btn sm" data-load="' + esc(g.id) + '">載入沿用</button><button class="btn sm danger" data-del="' + esc(g.id) + '">刪除</button></div></div></div>'; }).join('') : '<p class="muted">還沒有存過分組。</p>';
  $$('[data-load]', box).forEach((b) => { b.onclick = () => {
    const g = S.groupings.find((x) => x.id === b.dataset.load); let P = {}; try { P = JSON.parse(g.參數 || '{}'); } catch (e) { /* 舊資料 */ }
    const G = Object.assign({}, S.grp, P, { absent: new Set() }); const byTeam = {}; S.roster.forEach((r) => { byTeam[r['班級'] + '-' + r['座號']] = r['隊']; });
    const by = {}; g.members.forEach((m) => { (by[m.組別] = by[m.組別] || []).push({ cls: m.班級, no: m.座號, team: byTeam[m.班級 + '-' + m.座號] || '', v: m.成績 === '' ? null : m.成績, baton: m.棒次 }); });
    const groups = Object.keys(by).sort((a, b) => a - b).map((k) => by[k].sort((a, b) => (a.baton || 99) - (b.baton || 99)));
    S.grp.cur = { G, groups, title: g.名稱 }; showCur(); toast('已載入「' + g.名稱 + '」，可直接使用或調整'); $('#res').scrollIntoView({ behavior: 'smooth' });
  }; });
  $$('[data-del]', box).forEach((b) => { b.onclick = async () => { if (!confirm('確定刪除這筆分組紀錄？')) return; try { S.groupings = await run('tc_deleteGrouping', b.dataset.del); drawSaved(); } catch (e) { toast(e.message); } }; });
}
async function viewGroups() {
  const G = S.grp; G.scope = G.scope || S.classes[0];
  if (!S.groupings) S.groupings = await run('tc_getGroupings');
  const scopes = S.classes.concat(['兩班合併']);
  const absentBox = () => (G.scope === '兩班合併' ? S.classes : [G.scope]).map((c) => '<div class="small"><b>' + esc(c) + '</b>：' + clsRoster(c).map((r) => { const k = c + '-' + r['座號'];
    return '<label class="abs"><input type="checkbox" data-abs="' + k + '"' + (G.absent.has(k) ? ' checked' : '') + '>' + r['座號'] + '</label>'; }).join('') + '</div>').join('');
  $('#main').innerHTML = '<div class="card"><h3>1. 要分誰、依什麼分</h3><div class="row">' +
    '<div class="f"><label>範圍</label><select id="sc">' + optList(scopes, G.scope) + '</select></div>' +
    '<div class="f"><label>依據的項目</label><select id="gi">' + optList(ITEMS.map((i) => i.name), G.item) + '</select></div>' +
    '<div class="f"><label>取哪個成績</label><select id="gb"><option value="latest"' + (G.basis === 'latest' ? ' selected' : '') + '>每人最近一次測驗</option><option value="best"' + (G.basis === 'best' ? ' selected' : '') + '>每人歷史最好</option></select></div></div>' +
    '<details style="margin-top:8px"' + (G.absent.size ? ' open' : '') + '><summary>今天缺席／不參加的人（勾選的不會被分組）</summary><div id="abs">' + absentBox() + '</div></details></div>' +
    '<div class="card"><h3>2. 分組方式</h3><div class="f"><label>方式</label><select id="gm">' + Object.entries(METHODS).map(([k, m]) => '<option value="' + k + '"' + (G.method === k ? ' selected' : '') + '>' + esc(m.label) + '</option>').join('') + '</select></div>' +
    '<p class="small muted" id="mh" style="margin:6px 0"></p><div class="row" id="kk">' +
    '<div class="f"><label>怎麼決定組數</label><select id="bm"><option value="k"' + (G.byMode === 'k' ? ' selected' : '') + '>指定分幾組</option><option value="size"' + (G.byMode === 'size' ? ' selected' : '') + '>指定每組幾人</option></select></div>' +
    '<div class="f" id="kw"><label>組數</label><input id="k" type="number" min="1" max="20" value="' + G.k + '" style="width:6em"></div><div class="f" id="sw"><label>每組人數</label><input id="sz" type="number" min="1" max="20" value="' + G.size + '" style="width:6em"></div></div>' +
    '<div class="row" style="margin-top:8px"><div class="f"><label>接力棒次</label><select id="od"><option value="slow_first"' + (G.order === 'slow_first' ? ' selected' : '') + '>由慢到快（最快的壓軸）</option><option value="fast_first"' + (G.order === 'fast_first' ? ' selected' : '') + '>由快到慢（最快的先跑）</option><option value="none"' + (G.order === 'none' ? ' selected' : '') + '>不排棒次</option></select></div>' +
    '<div class="f"><label>還沒有成績的人</label><select id="um"><option value="spread"' + (G.unmeasured === 'spread' ? ' selected' : '') + '>平均分到各組</option><option value="skip"' + (G.unmeasured === 'skip' ? ' selected' : '') + '>先不分組</option></select></div></div>' +
    '<div style="margin-top:12px"><button class="btn" id="mk">產生分組</button></div></div>' +
    '<div id="res"></div><h2>已存的分組（下一堂課沿用）</h2><div id="saved"></div>';
  const sync = () => { const m = METHODS[G.method]; $('#mh').textContent = m.hint; const fixed = G.method === 'pairs' || G.method === 'team'; $('#kk').style.display = fixed ? 'none' : ''; $('#kw').style.display = G.byMode === 'k' ? '' : 'none'; $('#sw').style.display = G.byMode === 'size' ? '' : 'none'; $('#um').parentElement.style.display = m.needsValue ? '' : 'none'; };
  $('#sc').onchange = (e) => { G.scope = e.target.value; G.absent = new Set(); viewGroups(); };
  $('#gi').onchange = (e) => { G.item = e.target.value; };
  $('#gb').onchange = (e) => { G.basis = e.target.value; };
  $('#gm').onchange = (e) => { G.method = e.target.value; sync(); };
  $('#bm').onchange = (e) => { G.byMode = e.target.value; sync(); };
  $('#od').onchange = (e) => { G.order = e.target.value; };
  $('#um').onchange = (e) => { G.unmeasured = e.target.value; };
  $('#abs').onchange = (e) => { const k = e.target.dataset.abs; if (!k) return; if (e.target.checked) G.absent.add(k); else G.absent.delete(k); };
  $('#mk').onclick = doGroup;
  sync(); drawSaved(); showCur();
}

/* ===== 4. 名單 ===== */
// 一行一位：第一格是座號；其餘各格不分順序——純數字＝隊、男／女＝性別、其他＝暱稱
const SEXWORD = { 男: '男', 女: '女', m: '男', f: '女', boy: '男', girl: '女', 男生: '男', 女生: '女' };
function parseRoster(text) {
  return text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((l, i) => {
    const c = l.split(/[,\t，]/).map((x) => x.trim()); const r = { '座號': c[0], '隊': '', '性別': '', '暱稱': '' };
    c.slice(1).forEach((x) => { if (!x) return; const w = SEXWORD[x.toLowerCase()]; if (w) r['性別'] = w; else if (/^\d+$/.test(x) && !r['隊']) r['隊'] = x; else r['暱稱'] = x; });
    if (!r['隊']) r['隊'] = Math.ceil((i + 1) / 3);
    return r;
  });
}
const serializeRoster = (rows) => rows.map((r) => [r['座號'], r['隊'], r['性別'], r['暱稱']].join(',').replace(/,+$/, '')).join('\n');
async function viewRoster() {
  const Z = S.ros; Z.cls = Z.cls || S.classes[0];
  $('#main').innerHTML = '<div class="card"><p class="small muted">每班各貼一次。每行一位學生：<code>座號,隊,性別,暱稱</code>（後面幾格可以省略、順序也可以換；逗號、Tab 都可以，可直接從 Excel 貼上）。<b>性別填「男」或「女」</b>，運動會挑選手和「同性別名次」會用到。沒寫隊的，依順序每 3 人自動一隊。<b>請用座號或代號，不要貼真實全名。</b>儲存只會取代選的那一班，另一班不動。</p>' +
    '<div class="row"><select id="rc">' + optList(S.classes, Z.cls) + '</select><span class="small muted" id="rn"></span></div>' +
    '<textarea id="rt" rows="12" style="margin-top:8px" placeholder="1,1,男&#10;2,1,女&#10;3,1,男&#10;4,2,女"></textarea>' +
    '<div class="small" id="rsx" style="margin-top:8px"></div>' +
    '<div class="row" style="margin-top:8px"><button class="btn" id="rs">儲存這一班的名單</button></div></div>';
  const sexUI = () => { const rows = parseRoster($('#rt').value), miss = rows.filter((r) => !r['性別']).length;
    $('#rn').textContent = '目前 ' + rows.length + ' 人（男 ' + rows.filter((r) => r['性別'] === '男').length + '、女 ' + rows.filter((r) => r['性別'] === '女').length + (miss ? '、未填 ' + miss : '') + '）';
    $('#rsx').innerHTML = rows.length ? '<details' + (miss ? ' open' : '') + '><summary>逐位設定性別（' + (miss ? '還有 ' + miss + ' 位沒填' : '都填好了') + '）</summary><div style="margin-top:6px">' + rows.map((r, i) => '<label class="abs">' + esc(r['座號']) + '號 <select data-i="' + i + '" style="font-size:.9rem;padding:2px 4px"><option value="">未填</option><option' + (r['性別'] === '男' ? ' selected' : '') + '>男</option><option' + (r['性別'] === '女' ? ' selected' : '') + '>女</option></select></label>').join('') + '</div></details>' : '';
    $$('select[data-i]', $('#rsx')).forEach((s) => { s.onchange = () => { const all = parseRoster($('#rt').value); all[+s.dataset.i]['性別'] = s.value; $('#rt').value = serializeRoster(all); sexUI(); }; }); };
  const fill = () => { const L = clsRoster(Z.cls); $('#rt').value = serializeRoster(L.map((r) => ({ '座號': r['座號'], '隊': r['隊'], '性別': sexOf(r), '暱稱': r['暱稱'] || '' }))); sexUI(); };
  $('#rc').onchange = (e) => { Z.cls = e.target.value; fill(); }; $('#rt').oninput = sexUI; fill();
  $('#rs').onclick = async () => {
    const roster = parseRoster($('#rt').value);
    if (!roster.length) return toast('名單是空的'); if (roster.some((r) => !/^\d+$/.test(String(r['座號'])))) return toast('座號必須是數字');
    const miss = roster.filter((r) => !r['性別']).length;
    if (!confirm('要用這 ' + roster.length + ' 人取代「' + Z.cls + '」目前的名單嗎？' + (miss ? '\n（有 ' + miss + ' 位沒填性別，之後挑運動會選手時會被略過）' : ''))) return;
    try { S.roster = await run('tc_saveRoster', Z.cls, roster); S.assess = {}; S.assessRaw = {}; toast('已儲存 ' + roster.length + ' 人'); fill(); } catch (e) { toast('失敗：' + e.message); }
  };
}

/* ===== 啟動 ===== */
run('tc_init').then((d) => { S.roster = d.roster; S.classes = d.classes; S.rec.cls = S.classes[0]; S.grp.scope = S.classes[0]; go('rec'); })
  .catch((e) => { $('#main').innerHTML = '<div class="notice">無法啟動：' + esc(e.message) + '<br>請確認是用「只有我自己」的部署網址開啟，並已登入擁有這份試算表的 Google 帳號。</div>'; });
</script>
